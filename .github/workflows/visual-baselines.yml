name: Visual regression baselines
run-name: 'Visual baselines (${{ github.event_name }} on ${{ github.ref_name }})'

# Generates the screenshot baselines tests/visual.spec.ts compares against, on
# the same runner image and browser build the e2e job uses, and commits them to
# the branch that asked for them. Baselines made on a developer machine fail in
# CI over font rasterization and Chromium build differences, which is why this
# is a workflow and not a local command.
#
# Runs when .github/visual-baselines.json changes on a branch (bump `refresh`
# to ask for new baselines after an intentional visual change) or on dispatch.
# It never runs on its own commit: it commits only PNGs, which are not in the
# trigger paths. It never runs on main either: main takes changes through pull
# requests only, so the baselines land on the branch that asked for them and
# arrive on main with that branch's merge.
#
# The commit is pushed with the workflow's own GITHUB_TOKEN, and GitHub does
# not start push/pull_request workflows for commits made with that token. So
# the CI run on the PR does NOT re-run by itself after the baselines land:
# re-run the "CI - Build and Test" workflow on the PR, or push any further
# commit, and the e2e job then compares against the committed baselines.

on:
  push:
    branches-ignore:
      - main
    paths:
      - '.github/visual-baselines.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baselines:
    name: Generate and commit baselines
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build the static export (no base path, same as the e2e job)
        run: pnpm run build

      - name: Generate baselines on this runner
        run: pnpm exec playwright test tests/visual.spec.ts --update-snapshots --reporter=list

      - name: Commit and push the baselines
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/visual.spec.ts-snapshots
          if git diff --cached --quiet; then
            echo "Baselines unchanged."
            exit 0
          fi
          git commit --no-verify -m "test(visual): refresh screenshot baselines on the CI renderer" \
            -m "Generated by .github/workflows/visual-baselines.yml (run ${{ github.run_id }})."
          git push origin "HEAD:${{ github.ref_name }}"
